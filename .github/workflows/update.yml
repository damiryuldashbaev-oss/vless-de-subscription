```yaml
name: Generate VLESS DE Subscription

on:
  workflow_dispatch:

  schedule:
    # Каждый день в 04:00 UTC
    - cron: "0 4 * * *"

  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  generate:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Python
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------
      # Run generator
      # ------------------------------------------------------

      - name: Generate subscription
        run: |
          python generate_sub.py

      # ------------------------------------------------------
      # Check output
      # ------------------------------------------------------

      - name: Show generated files
        run: |
          echo "Generated files:"
          ls -lah sub_de.txt sub_de_b64.txt servers_report.json

          echo
          echo "Number of servers:"
          grep -c '^vless://' sub_de.txt || true

      # ------------------------------------------------------
      # Commit results
      # ------------------------------------------------------

      - name: Commit subscription
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            sub_de.txt \
            sub_de_b64.txt \
            servers_report.json

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit \
            -m "Update VLESS DE subscription"

          git push
```
