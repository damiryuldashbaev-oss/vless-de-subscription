name: Update VLESS Subscription

on:
workflow_dispatch:

schedule:
- cron: "0 */6 * * *"

push:
branches:
- main

permissions:
contents: write

jobs:
update:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Generate subscription
    run: python generate_sub.py

  - name: Check generated files
    run: |
      echo "Generated files:"
      ls -lh sub_de.txt sub_de_b64.txt

      echo ""
      echo "VLESS servers:"
      grep -c "^vless://" sub_de.txt || true

  - name: Commit changes
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add sub_de.txt sub_de_b64.txt

      if git diff --cached --quiet; then
        echo "No changes to commit."
      else
        git commit -m "Update VLESS subscription"
        git push
      fi
