name: Update VLESS Subscription

on:
  schedule:
    - cron: '0 */6 * * *'   # каждые 6 часов
  workflow_dispatch:        # ручной запуск

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Xray-core
        run: |
          curl -L https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -o xray.zip
          unzip -o xray.zip -d xray
          chmod +x xray/xray
          sudo mv xray/xray /usr/local/bin/
          xray version

      - name: Install Python dependencies
        run: pip install --upgrade requests

      - name: Run generator
        run: python generate_sub.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sub_de.txt sub_de_b64.txt
          git diff --staged --quiet || git commit -m "Auto-update subscription [skip ci]"
          git push
